services:
  backend_v2:
    build: ./backend_v2
    container_name: tnhcomfy-backend
#    ports:
#      - "8002:8002"
    volumes:
      # Input/Output directories - create these in project root
      - ./input:/app/input
      - ./output:/app/output
      - ./backend_v2:/app
      - ./provider_containers:/app/provider_containers
      # Docker socket mount removed for security. Backend no longer spawns containers.
    env_file:
      - .env # Create .env file with HF_TOKEN, CIVITAI_TOKEN
    environment:
      - OUTPUT_DIR=/app/output
      - INPUT_DIR=/app/input
      - COMFY_UVICORN_RELOAD=1
    networks:
      - comfy-network
      - metrics
    restart: unless-stopped

  frontend_v2:
    build: ./frontend_v2
    container_name: tnhcomfy-frontend
#    ports:
#      - "5174:5174"
    volumes:
      - ./frontend_v2:/app:z
      - frontend_v2_node_modules:/app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8002 # For browser-side SSE
      - VITE_PROXY_TARGET=http://tnhcomfy-backend:8002 # For Vite server-side proxy
      - CHOKIDAR_USEPOLLING=true # Enable file watching in container
    depends_on:
      - backend_v2
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.tnhcomfy.rule=Host(`comfy.lan.thenaha.my.id`)
      - traefik.http.services.tnhcomfy.loadbalancer.server.port=5174
      - homepage.group=Projects
      - homepage.name=ComfyUI
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/comfyui.svg
      - homepage.href=http://comfy.lan.thenaha.my.id/
      - homepage.description=Image generation service
    networks:
      - comfy-network
      - proxy
    restart: unless-stopped

  provider-modal:
    build:
      context: ./provider_containers
      dockerfile: modal_worker/Dockerfile
    container_name: comfy-provider-modal
    env_file:
      - .env
    environment:
      - PROVIDER_ID=modal-primary-test
      - PORT=8000
      - BACKEND_URL=http://backend_v2:8002
    networks:
      - comfy-network
    restart: unless-stopped
    volumes:
      - ./backend_v2:/backend:ro

  provider-beam:
    build:
      context: ./provider_containers
      dockerfile: beam_worker/Dockerfile
    container_name: comfy-provider-beam
    env_file:
      - .env
    environment:
      - PROVIDER_ID=beam-worker-test
      - PORT=8000
      - BACKEND_URL=http://backend_v2:8002
    networks:
      - comfy-network
    restart: unless-stopped
    volumes:
      - ./backend_v2:/backend:ro

volumes:
  frontend_v2_node_modules:

networks:
  comfy-network:
    name: comfy-network # Explicit name prevents docker-compose project prefix
    driver: bridge
  metrics:
    external: true
  proxy:
    external: true
