x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tnhcomfy-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-comfy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-comfy}
      - POSTGRES_DB=${POSTGRES_DB:-comfy}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    networks:
      - tnhcomfy
    restart: unless-stopped
    logging: *bounded-logging
    # The one service here with neither. Docker's default /dev/shm is 64 MiB,
    # which PostgreSQL uses for parallel-query shared memory: two concurrent index
    # builds on a small host fail with "could not resize shared memory segment
    # /PostgreSQL.<pid>", and the build aborts rather than degrading.
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comfy}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend_v2:
    build: ./backend_v2
    container_name: tnhcomfy-backend
    depends_on:
      db:
        condition: service_healthy
    # Port 8002 bound specifically to the private NetBird mesh interface
    # (never published to 0.0.0.0 public internet).
    ports:
      - "${COMFY_BACKEND_BIND:-100.150.0.4}:8002:8002"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      # A dedicated hostname for the API, and deliberately NOT the Tailscale IP.
      #
      # Both rules originally claimed `Host(100.150.0.4)` alongside their own
      # hostname, so two routers matched the same request and Traefik logged
      # `Router comfyui cannot be linked automatically with multiple Services`
      # every few seconds while picking one of them — which is how the whole app
      # started serving JSON at its own address. Two rules, one host each: no
      # overlap, no priority to get wrong.
      #
      # `comfy.lan.thenaha.my.id` serves the frontend, and the frontend's Vite dev
      # server already proxies `/api` to here in-process, so the browser never
      # needs this hostname. It exists for curl, Postman and anything else talking
      # to the API directly.
      - traefik.http.routers.comfyui-api.rule=Host(`comfy-backend.lan.thenaha.my.id`)
      - traefik.http.routers.comfyui-api.entrypoints=websecure
      - traefik.http.routers.comfyui-api.tls=true
      - traefik.http.services.comfyui-api.loadbalancer.server.port=8002
    user: "1000:1000"
    volumes:
      - ./data:/data
      # Read-only mount of the project root so in-process engines can resolve
      # per-provider credential files (.env.<provider-id>) via COMFY_PROVIDER_ENV_PATH.
      - ./:/comfyui:ro
    env_file:
      - .env
    environment:
      - OUTPUT_DIR=/data/output
      - INPUT_DIR=/data/input
      # The DSN is assembled by the backend from discrete values, which is the
      # only place a password can be percent-encoded. Interpolating it here meant
      # a `POSTGRES_PASSWORD` containing `@ : / #` produced an unparseable URL, the
      # backend never passed its healthcheck, and the frontend plus all five
      # providers — every one of which waits on that healthcheck — never started.
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-comfy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-comfy}
      - POSTGRES_DB=${POSTGRES_DB:-comfy}
      - COMFY_PREVIEW_CACHE_DIR=/data/models/cache
      - COMFY_PREVIEW_PREFETCH_ENABLED=true
      - HF_HOME=/data/hf-cache
      - XDG_CACHE_HOME=/data/cache
      # The Settings UI writes this file. Without the override it resolves to
      # /app/config.json — the container's writable layer, since this service
      # mounts only ./data — so every change made in the UI (system prompts,
      # generator.default_checkpoint, jobs.*, image_processing.*) was accepted
      # with a 200 and then discarded by the next recreate. /data is the same
      # bind mount as the Postgres cluster and the generated images, and
      # config.py seeds it from the shipped defaults on first boot.
      - COMFY_CONFIG_PATH=/data/config.json
      - COMFY_PROVIDER_TOKEN=${COMFY_PROVIDER_TOKEN:-}
      # `COMFY_DISCOVERY_ALLOW_NEW_PROVIDERS` used to be injected here and is
      # gone: no code read it after 2026-10-03, so it was a dead variable
      # re-added on every `up` while the audit and STATUS.md both claimed it had
      # been removed from compose. See docs/audit-2026-10-03.md §4 — the flag was
      # an opt-in gate dressed as a security control, and all providers share one
      # bearer token, so the token was the entire boundary.
      #
      # Every origin the stack is reached on. The port is not optional:
      # `https://100.150.0.4` is Traefik on 443 and `http://100.150.0.4:5174` is
      # the Vite dev server directly — different scheme, different port, so the
      # first does not match the second.
      #
      # Measured on the omission: browsing `http://100.150.0.4:5174` made the
      # socket.io handshake return 400 `"... is not an accepted origin."`, which
      # the client retries forever, which is a permanent "Disconnected from
      # server. Trying to reconnect" toast. Every HTTP request still succeeded,
      # so the app looks healthy while realtime is dead.
      #
      # This default outranks config.json (`COMFY_*` > config.json >
      # DEFAULT_CONFIG), so it is the line that actually governs the policy.
      - COMFY_CORS_ORIGINS=${COMFY_CORS_ORIGINS:-["http://localhost:5174","http://localhost:8002","http://127.0.0.1:5174","https://comfy.lan.thenaha.my.id","https://100.150.0.4","http://100.150.0.4:5174"]}
      - COMFY_UVICORN_RELOAD=0
      - COMFY_PROVIDER_ENV_PATH=/comfyui
      # /data/modal_pkg is a site-packages copy that predates `modal>=1.5.0`
      # landing in backend_v2/requirements.txt. A fresh `docker build` installs
      # modal 1.6.1 into the image's own site-packages and `import modal`
      # resolves there — measured 2026-10-09 with `env -u PYTHONPATH`.
      #
      # The line is kept deliberately: `data/` is a bind mount shared by every
      # container on this stack, so removing it here breaks the RUNNING backend
      # on its next restart until the image is rebuilt. Removing it is a
      # rebuild-then-verify step, not a compose edit:
      #   1. docker compose -f docker-compose.yml -f docker-compose.dev.yml build backend_v2
      #   2. docker compose ... up -d backend_v2   (no PYTHONPATH)
      #   3. docker exec tnhcomfy-backend python3 -c "import modal; print(modal.__file__)"
      #      -> .../site-packages/modal/__init__.py, not /data/modal_pkg/...
      #   4. delete this line
      - PYTHONPATH=/data/modal_pkg
    networks:
      - tnhcomfy
      - metrics
      - proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/api/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend_v2:
    build:
      context: ./frontend_v2
      target: prod
    container_name: tnhcomfy-frontend
    depends_on:
      backend_v2:
        condition: service_healthy
    ports:
# Host port 5174 → container port 5174.
#
# The default is loopback, and that is the security control. An earlier revision
# read "unlike the backend this one is just a dev server" and published it on
# `0.0.0.0` — which re-opened the exact hole removing the backend's host port was
# meant to close, because this service is a **reverse proxy to that API**:
# `frontend_v2/nginx.conf` `server_name _;` and `location /api/` forwards to
# `backend_v2:8002` with no host check. Measured on the running stack:
# `curl http://192.168.1.28:5174/api/ready` → 200. So `0.0.0.0:5174` published
# the whole unauthenticated API — every prompt, and `DELETE /api/jobs`, which is
# how 154 rows of job history were deleted on 2026-10-01 — to every interface,
# including the plain home LAN that NetBird does not cover.
#
# Traefik reaches this service on the external `proxy` network and does not need
# a host port at all, so loopback costs nothing on the documented deployment.
#
# To reach the site over a VPN address or a LAN address, name that one address:
#     COMFY_FRONTEND_BIND=100.150.0.4
# Naming a single address is deliberate. `0.0.0.0` is the one value that widens
# the exposure, and this indirection makes the safe case the default rather than
# the thing you have to remember. `scripts/preflight.sh` reports the effective
# bind and fails on a wildcard.
#
# There are two bindings because one host address cannot be both `localhost` and
# a VPN address, and losing `http://localhost:5174` — the primary documented dev
# path — is not a trade worth making. The second defaults to `127.0.0.2`, which is
# inside 127.0.0.0/8 and therefore unroutable and unreachable from any network, so
# the unset case publishes loopback twice and exposes nothing. Docker rejects two
# identical bindings ("address already in use"), which is why the default is a
# distinct loopback address rather than a repeat of the first.
      - "127.0.0.1:5174:5174"
      - "${COMFY_FRONTEND_BIND:-127.0.0.2}:5174:5174"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.comfyui-frontend.rule=Host(`comfy.lan.thenaha.my.id`) || Host(`100.150.0.4`)
      - traefik.http.routers.comfyui-frontend.entrypoints=websecure
      - traefik.http.routers.comfyui-frontend.tls=true
      - traefik.http.services.comfyui-frontend.loadbalancer.server.port=5174
      - homepage.group=Projects
      - homepage.name=ComfyUI
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/comfyui.svg
      - homepage.href=http://comfy.lan.thenaha.my.id/
      - homepage.description=Image generation service
    networks:
      - tnhcomfy
      - proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5174/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Remote Agent lives on the MACHINE HOSTING ComfyUI (not in this orchestrator
  # stack for production). Uncomment + point DATA_DIR at your ComfyUI models dir
  # ONLY when you want to smoke-test the agent locally on the same box as this
  # compose stack (it cannot reach a remote ComfyUI over localhost here).
  # remote-agent:
  #   build:
  #     context: .
  #     dockerfile: remote_agent/Dockerfile
  #   container_name: tnhcomfy-remote-agent
  #   environment:
  #     - DATA_DIR=/models
  #     - PORT=8001
  #     # Braced, and defaulted. Unbraced `${REMOTE_AGENT_TOKEN}` is interpolated
  #     # at PARSE time from the ROOT project .env, where the variable does not
  #     # exist, so compose silently substituted an empty string — and
  #     # remote_agent/server.py:23-24 raises at IMPORT when the token is empty
  #     # and REMOTE_AGENT_ALLOW_INSECURE is unset, so the agent crash-looped.
  #     # env_file cannot help here either: it populates the container
  #     # environment, not compose's own interpolation. On this rig, either set
  #     # REMOTE_AGENT_TOKEN in the root .env or export it in the shell that
  #     # runs compose.
  #     - REMOTE_AGENT_TOKEN=${REMOTE_AGENT_TOKEN:-}
  #     # An empty token above is a 401 loop, not an open agent. Uncomment this to
  #     # start it with no authentication at all — only on a machine with no
  #     # other network path in, and never on a routable address.
  #     - REMOTE_AGENT_ALLOW_INSECURE=${REMOTE_AGENT_ALLOW_INSECURE:-}
  #   volumes:
  #     - /opt/comfy/ComfyUI/models:/models:ro
  #     - :rw, not :ro. The agent's /upload-file, /download-model, /delete-model
  #     and /delete-file all write, and remote_agent/Dockerfile mounts
  #     /opt/comfy/ComfyUI/models itself for the same reason — a :ro here would
  #     make the container's own mount disagree with the image it is built from.
  #     - ./data/remote-agent/downloads:/models/downloads
  #   ports:
  #     - "8001:8001"
  # NOTE: the `profiles: [providers]` gate this block used to carry is gone. The
  # profile only ever gated the SIX provider-container services, which were
  # deleted with `provider_containers/` on 2026-10-09 — and while they existed it
  # was the reason `--profile providers build` failed with a missing build
  # context. Nothing in this stack uses the profile now, so a service here starts
  # on a plain `up` exactly as the comment above always intended.

networks:
  tnhcomfy:
    name: tnhcomfy
    driver: bridge
  metrics:
    name: metrics
    external: true
  proxy:
    name: proxy
    external: true
