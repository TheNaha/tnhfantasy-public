services:
  backend_v2:
    build: ./backend_v2
    container_name: tnhcomfy-backend
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      - OUTPUT_DIR=/data/output
      - INPUT_DIR=/data/input
      - COMFY_UVICORN_RELOAD=0
    networks:
      - comfy-network
      - metrics
    restart: unless-stopped

  frontend_v2:
    build:
      context: ./frontend_v2
      target: prod
    container_name: tnhcomfy-frontend
    depends_on:
      - backend_v2
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.tnhcomfy.rule=Host(`comfy.lan.thenaha.my.id`)
      - traefik.http.services.tnhcomfy.loadbalancer.server.port=80
      - homepage.group=Projects
      - homepage.name=ComfyUI
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/comfyui.svg
      - homepage.href=http://comfy.lan.thenaha.my.id/
      - homepage.description=Image generation service
    networks:
      - comfy-network
      - proxy
    restart: unless-stopped

  provider-modal:
    build:
      context: ./provider_containers
      dockerfile: modal_worker/Dockerfile
    container_name: comfy-provider-modal
    env_file:
      - .env
    environment:
      - PROVIDER_ID=modal-primary
      - PORT=8000
      - BACKEND_URL=http://backend_v2:8002
    networks:
      - comfy-network
    restart: unless-stopped

  provider-beam:
    build:
      context: ./provider_containers
      dockerfile: beam_worker/Dockerfile
    container_name: comfy-provider-beam
    env_file:
      - .env
    environment:
      - PROVIDER_ID=beam-primary
      - PORT=8000
      - BACKEND_URL=http://backend_v2:8002
    networks:
      - comfy-network
    restart: unless-stopped

networks:
  comfy-network:
    name: comfy-network
    driver: bridge
  metrics:
    external: true
  proxy:
    external: true
