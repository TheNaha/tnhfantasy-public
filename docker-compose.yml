x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tnhcomfy-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-comfy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-comfy}
      - POSTGRES_DB=${POSTGRES_DB:-comfy}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    networks:
      - tnhcomfy
    restart: unless-stopped
    logging: *bounded-logging
    # The one service here with neither. Docker's default /dev/shm is 64 MiB,
    # which PostgreSQL uses for parallel-query shared memory: two concurrent index
    # builds on a small host fail with "could not resize shared memory segment
    # /PostgreSQL.<pid>", and the build aborts rather than degrading.
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comfy}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend_v2:
    build: ./backend_v2
    container_name: tnhcomfy-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8002:8002"
    user: "1000:1000"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      - OUTPUT_DIR=/data/output
      - INPUT_DIR=/data/input
      # The DSN is assembled by the backend from discrete values, which is the
      # only place a password can be percent-encoded. Interpolating it here meant
      # a `POSTGRES_PASSWORD` containing `@ : / #` produced an unparseable URL, the
      # backend never passed its healthcheck, and the frontend plus all five
      # providers — every one of which waits on that healthcheck — never started.
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-comfy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-comfy}
      - POSTGRES_DB=${POSTGRES_DB:-comfy}
      - COMFY_PREVIEW_CACHE_DIR=/data/models/cache
      - COMFY_PREVIEW_PREFETCH_ENABLED=true
      - HF_HOME=/data/hf-cache
      - XDG_CACHE_HOME=/data/cache
      # The Settings UI writes this file. Without the override it resolves to
      # /app/config.json — the container's writable layer, since this service
      # mounts only ./data — so every change made in the UI (system prompts,
      # generator.default_checkpoint, jobs.*, image_processing.*) was accepted
      # with a 200 and then discarded by the next recreate. /data is the same
      # bind mount as the Postgres cluster and the generated images, and
      # config.py seeds it from the shipped defaults on first boot.
      - COMFY_CONFIG_PATH=/data/config.json
      - COMFY_PROVIDER_TOKEN=${COMFY_PROVIDER_TOKEN:-}
      - COMFY_DISCOVERY_ALLOW_NEW_PROVIDERS=${COMFY_DISCOVERY_ALLOW_NEW_PROVIDERS:-0}
      - COMFY_CORS_ORIGINS=${COMFY_CORS_ORIGINS:-["http://localhost:5174","https://comfy.lan.thenaha.my.id","https://100.150.0.4"]}
      - COMFY_UVICORN_RELOAD=0
    networks:
      - tnhcomfy
      - metrics
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/api/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend_v2:
    build:
      context: ./frontend_v2
      target: prod
    container_name: tnhcomfy-frontend
    depends_on:
      backend_v2:
        condition: service_healthy
    ports:
      # Host port 5174 → container port 5174 (for direct localhost access)
      - "5174:5174"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.comfyui-frontend.rule=Host(`comfy.lan.thenaha.my.id`) || Host(`100.150.0.4`)
      - traefik.http.routers.comfyui-frontend.entrypoints=websecure
      - traefik.http.routers.comfyui-frontend.tls=true
      - traefik.http.services.comfyui-frontend.loadbalancer.server.port=5174
      - homepage.group=Projects
      - homepage.name=ComfyUI
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/comfyui.svg
      - homepage.href=http://comfy.lan.thenaha.my.id/
      - homepage.description=Image generation service
    networks:
      - tnhcomfy
      - proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5174/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Provider containers - managed by compose (backend autostart is disabled).
  # To add a provider: copy this block, set a unique PROVIDER_ID and container_name.
  # container_name MUST be "tnhcomfy-{PROVIDER_ID}" so the backend can detect it
  # (see infrastructure/providers/runtime.py:provider_container_name).
  provider-modal-zetsuke:
    build:
      context: ./provider_containers
      dockerfile: image_worker/Dockerfile
    container_name: tnhcomfy-modal-zetsuke
    depends_on:
      backend_v2:
        condition: service_healthy
    profiles:
      - providers
    env_file:
      - .env.modal-zetsuke
    environment:
      - PROVIDER_ID=modal-zetsuke
      - PORT=8000
      - BACKEND_URL=http://backend_v2:8002
      - COMFY_PROVIDER_TOKEN=${COMFY_PROVIDER_TOKEN:-}
    user: "1000:1000"
    logging: *bounded-logging
    # Mount /data so provider workers can access models, input, output
    volumes:
      - ./data:/data
    networks:
      - tnhcomfy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"
    healthcheck:
      # /live, not /health: the container healthcheck reports whether the worker
      # process is serving. /health additionally probes the upstream and is the
      # dispatcher-facing signal; a provider whose upstream is down should be
      # excluded from dispatch, not restart-looped by its own healthcheck.
      # $PORT, not a literal 8000: PORT is set per service below.
      test: ["CMD-SHELL", "python3 -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:%s/live' % os.environ.get('PORT', '8000'))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  provider-modal-hp196:
    build:
      context: ./provider_containers
      dockerfile: image_worker/Dockerfile
    container_name: tnhcomfy-modal-hp196
    depends_on:
      backend_v2:
        condition: service_healthy
    profiles:
      - providers
    env_file:
      - .env.modal-hp196
    environment:
      - PROVIDER_ID=modal-hp196
      - PORT=8000
      - BACKEND_URL=http://backend_v2:8002
      - COMFY_PROVIDER_TOKEN=${COMFY_PROVIDER_TOKEN:-}
    user: "1000:1000"
    logging: *bounded-logging
    # Mount /data so provider workers can access models, input, output
    volumes:
      - ./data:/data
    networks:
      - tnhcomfy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"
    healthcheck:
      # /live, not /health: the container healthcheck reports whether the worker
      # process is serving. /health additionally probes the upstream and is the
      # dispatcher-facing signal; a provider whose upstream is down should be
      # excluded from dispatch, not restart-looped by its own healthcheck.
      # $PORT, not a literal 8000: PORT is set per service below.
      test: ["CMD-SHELL", "python3 -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:%s/live' % os.environ.get('PORT', '8000'))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  provider-modal-stepmania:
    build:
      context: ./provider_containers
      dockerfile: image_worker/Dockerfile
    container_name: tnhcomfy-modal-stepmania
    depends_on:
      backend_v2:
        condition: service_healthy
    profiles:
      - providers
    env_file:
      - .env.modal-stepmania
    environment:
      - PROVIDER_ID=modal-stepmania
      - PORT=8000
      - BACKEND_URL=http://backend_v2:8002
      - COMFY_PROVIDER_TOKEN=${COMFY_PROVIDER_TOKEN:-}
    user: "1000:1000"
    logging: *bounded-logging
    # Mount /data so provider workers can access models, input, output
    volumes:
      - ./data:/data
    networks:
      - tnhcomfy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"
    healthcheck:
      # /live, not /health: the container healthcheck reports whether the worker
      # process is serving. /health additionally probes the upstream and is the
      # dispatcher-facing signal; a provider whose upstream is down should be
      # excluded from dispatch, not restart-looped by its own healthcheck.
      # $PORT, not a literal 8000: PORT is set per service below.
      test: ["CMD-SHELL", "python3 -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:%s/live' % os.environ.get('PORT', '8000'))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # TTS provider. One provider = one container, the same as the image and LLM
  # workers: its own Dockerfile, its own compose service, and it registers
  # itself with the backend by heartbeat.
  #
  # It is separate rather than a second app behind the image worker because the
  # image worker's `/health` only checks that MODAL_APP_NAME is set, so a shared
  # container would report healthy for both apps while being entirely blind to
  # the TTS one. Separate containers mean separate health, separate failure
  # domains, and TTS can be deployed or removed without touching image work.
  #
  # It deploys the `comfy-modal-tts` Modal app, which has its own image: the
  # image worker's cold start is 57.66s on an L4, of which ~44s is in-container
  # and ~42s of that is ComfyUI's own boot — the heavy `ultralytics` import and
  # the enumeration of 531 model files on the /mnt/data volume. The TTS image has
  # neither.
  #
  # Name it `tts-modal-*` so `_infer_discovery_type` registers it with
  # worker_type="tts"; anything else falls through to direct_url/image and the
  # provider is offered checkpoint jobs its container cannot run.
  provider-tts-modal-hp196:
    # Named, not left to compose's auto-generated tag: the backend's deploy
    # path resolves the image to build from `worker_type`, and
    # `ProviderRegistry.get_worker_image` returns this name, so the two have to
    # agree. Sibling of `build:`, which is where compose takes it from.
    image: tnhcomfy/tts-worker:latest
    build:
      context: ./provider_containers
      dockerfile: tts_worker/Dockerfile
    container_name: tnhcomfy-tts-modal-hp196
    depends_on:
      backend_v2:
        condition: service_healthy
    profiles:
      - providers
    env_file:
      - .env.tts-modal-hp196
    environment:
      - PROVIDER_ID=tts-modal-hp196
      - PORT=8000
      - BACKEND_URL=http://backend_v2:8002
      - COMFY_PROVIDER_TOKEN=${COMFY_PROVIDER_TOKEN:-}
      - ENGINE=modal
    user: "1000:1000"
    logging: *bounded-logging
    volumes:
      - ./data:/data
    networks:
      - tnhcomfy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Speaks over Modal; holds no models. The image worker gets 8G/4cpu
          # because it reconciles hundreds of checkpoints; this needs neither.
          memory: 2G
          cpus: "1"
    healthcheck:
      # /live, not /health: reports whether the worker process is serving. Same
      # reasoning and same $PORT reading as the other providers.
      test: ["CMD-SHELL", "python3 -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:%s/live' % os.environ.get('PORT', '8000'))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  provider-llm-local:
    build:
      context: ./provider_containers
      dockerfile: llm_worker/Dockerfile
    container_name: tnhcomfy-llm-local
    profiles:
      - providers
    env_file:
      - .env.llm-local
    depends_on:
      backend_v2:
        condition: service_healthy
    environment:
      - PROVIDER_ID=llm-local
      - PORT=8000
      - BACKEND_URL=http://backend_v2:8002
      - COMFY_PROVIDER_TOKEN=${COMFY_PROVIDER_TOKEN:-}
      - ENGINE=openai_compat
    user: "1000:1000"
    volumes:
      - ./data:/data
    networks:
      - tnhcomfy
    restart: unless-stopped
    logging: *bounded-logging
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    healthcheck:
      # /live, not /health: the container healthcheck reports whether the worker
      # process is serving. /health additionally probes the upstream and is the
      # dispatcher-facing signal; a provider whose upstream is down should be
      # excluded from dispatch, not restart-looped by its own healthcheck.
      # $PORT, not a literal 8000: PORT is set per service below.
      test: ["CMD-SHELL", "python3 -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:%s/live' % os.environ.get('PORT', '8000'))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  provider-direct-url:
    build:
      context: ./provider_containers
      dockerfile: image_worker/Dockerfile
    # container_name is derived from PROVIDER_ID, not hand-picked: the backend
    # builds the name it looks for with
    # `provider_container_name(provider.id)` (infrastructure/providers/runtime.py),
    # i.e. `tnhcomfy-{PROVIDER_ID}` verbatim. This pair previously read
    # `container_name: tnhcomfy-direct-url` against `PROVIDER_ID=direct_url`, so
    # the backend asked for `tnhcomfy-direct_url` — a container that does not
    # exist. `containers.get(...)` then raised and the panel reported a running
    # provider as stopped, and the ping built
    # `http://tnhcomfy-direct_url:8000/health` and got a DNS failure. Job dispatch
    # kept working because it goes through `config["discovery_url"]` instead, so
    # the mismatch only ever showed up in the UI an operator reads to decide
    # whether the provider is up.
    #
    # The underscore is valid in a container name and the provider id is already
    # `direct_url` in the database, so the name moves to match the id rather than
    # the other way round. Renaming the id to `direct-url` instead would need a
    # data migration (provider rows, provider file statuses, job rows) for no
    # gain. Underscore-to-hyphen is NOT applied here: `provider_container_name`
    # does not normalise, so any normalisation has to live in one place.
    container_name: tnhcomfy-direct_url
    depends_on:
      backend_v2:
        condition: service_healthy
    profiles:
      - providers
    env_file:
      - .env.direct-url
    environment:
      # This block used to be missing entirely, so this provider received no
      # shared secret at all: it answered 503 on every protected route when the
      # management token was empty, and could not self-register when the
      # discovery token was empty. One name covers both now.
      # The engine has no default baked into the image, so state it here.
      - ENGINE=direct_url
      # These three were absent, so the worker fell back to
      # PROVIDER_ID="direct_url-worker" and BACKEND_URL="http://localhost:8002":
      # it posted discovery to its own loopback every 60 s forever, and the
      # backend built http://tnhcomfy-direct_url-worker:8000, a DNS name that
      # does not exist (the container is tnhcomfy-direct-url). A permanently
      # invisible provider that still reported healthy, because the healthcheck
      # does not probe anything.
      - PROVIDER_ID=direct_url
      - PORT=8000
      - BACKEND_URL=http://backend_v2:8002
      - COMFY_PROVIDER_TOKEN=${COMFY_PROVIDER_TOKEN:-}
    user: "1000:1000"
    volumes:
      - ./data:/data
    networks:
      - tnhcomfy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    healthcheck:
      # /live, not /health: the container healthcheck reports whether the worker
      # process is serving. /health additionally probes the upstream and is the
      # dispatcher-facing signal; a provider whose upstream is down should be
      # excluded from dispatch, not restart-looped by its own healthcheck.
      # $PORT, not a literal 8000: PORT is set per service below.
      test: ["CMD-SHELL", "python3 -c \"import os, urllib.request; urllib.request.urlopen('http://localhost:%s/live' % os.environ.get('PORT', '8000'))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

