services:
  backend_v2:
    build: ./backend_v2
    container_name: tnhcomfy-backend
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      - OUTPUT_DIR=/data/output
      - INPUT_DIR=/data/input
      - COMFY_DATABASE_URL=sqlite:////data/db/comfy.db
      - COMFY_PREVIEW_CACHE_DIR=/data/models/cache
      - COMFY_UVICORN_RELOAD=0
    networks:
      - tnhcomfy
      - metrics
    restart: unless-stopped

  frontend_v2:
    build:
      context: ./frontend_v2
      target: prod
    container_name: tnhcomfy-frontend
    depends_on:
      - backend_v2
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.tnhcomfy.rule=Host(`comfy.lan.thenaha.my.id`)
      - traefik.http.services.tnhcomfy.loadbalancer.server.port=80
      - homepage.group=Projects
      - homepage.name=ComfyUI
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/comfyui.svg
      - homepage.href=http://comfy.lan.thenaha.my.id/
      - homepage.description=Image generation service
    networks:
      - tnhcomfy
      - proxy
    restart: unless-stopped

  # Provider containers - managed by compose (backend autostart is disabled).
  # To add a provider: copy this block, set a unique PROVIDER_ID and container_name.
  # container_name MUST be "comfy-provider-{PROVIDER_ID}" so the backend can detect it.
  provider-modal:
    build:
      context: ./provider_containers
      dockerfile: modal_worker/Dockerfile
    container_name: comfy-provider-modal-zetsuke
    env_file:
      - .env
    environment:
      - PROVIDER_ID=modal-zetsuke
      - PORT=8000
      - BACKEND_URL=http://backend_v2:8002
    # Mount /data so provider workers can access models, input, output
    volumes:
      - ./data:/data
    networks:
      - tnhcomfy
    restart: unless-stopped

  # provider-beam:
  #   build:
  #     context: ./provider_containers
  #     dockerfile: beam_worker/Dockerfile
  #   container_name: comfy-provider-beam-primary
  #   env_file:
  #     - .env
  #   environment:
  #     - PROVIDER_ID=beam-primary
  #     - PORT=8000
  #     - BACKEND_URL=http://backend_v2:8002
  #   networks:
  #     - tnhcomfy

networks:
  tnhcomfy:
    name: tnhcomfy
    driver: bridge
  metrics:
    external: true
  proxy:
    external: true
