x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: tnhcomfy-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-comfy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-comfy}
      - POSTGRES_DB=${POSTGRES_DB:-comfy}
    volumes:
      - ./data/pgdata:/var/lib/postgresql/data
    networks:
      - tnhcomfy
    restart: unless-stopped
    logging: *bounded-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comfy}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend_v2:
    build: ./backend_v2
    container_name: tnhcomfy-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8002:8002"
    user: "1000:1000"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      - OUTPUT_DIR=/data/output
      - INPUT_DIR=/data/input
      - COMFY_DATABASE_URL=postgresql://${POSTGRES_USER:-comfy}:${POSTGRES_PASSWORD:-comfy}@db:5432/${POSTGRES_DB:-comfy}
      - COMFY_PREVIEW_CACHE_DIR=/data/models/cache
      - COMFY_PREVIEW_PREFETCH_ENABLED=true
      - HF_HOME=/data/hf-cache
      - XDG_CACHE_HOME=/data/cache
      - COMFY_DISCOVERY_TOKEN=${COMFY_DISCOVERY_TOKEN:-}
      - PROVIDER_WORKER_TOKEN=${PROVIDER_WORKER_TOKEN:-}
      - COMFY_DISCOVERY_ALLOW_NEW_PROVIDERS=${COMFY_DISCOVERY_ALLOW_NEW_PROVIDERS:-0}
      - COMFY_UVICORN_RELOAD=0
    networks:
      - tnhcomfy
      - metrics
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/api/ready')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend_v2:
    build:
      context: ./frontend_v2
      target: prod
    container_name: tnhcomfy-frontend
    depends_on:
      backend_v2:
        condition: service_healthy
    ports:
      # Host port 5174 → container port 5174 (for direct localhost access)
      - "5174:5174"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.comfyui-frontend.rule=Host(`comfy.lan.thenaha.my.id`) || Host(`100.150.0.4`)
      - traefik.http.routers.comfyui-frontend.entrypoints=websecure
      - traefik.http.routers.comfyui-frontend.tls=true
      - traefik.http.services.comfyui-frontend.loadbalancer.server.port=5174
      - homepage.group=Projects
      - homepage.name=ComfyUI
      - homepage.icon=https://cdn.jsdelivr.net/gh/selfhst/icons@main/svg/comfyui.svg
      - homepage.href=http://comfy.lan.thenaha.my.id/
      - homepage.description=Image generation service
    networks:
      - tnhcomfy
      - proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5174/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Provider containers - managed by compose (backend autostart is disabled).
  # To add a provider: copy this block, set a unique PROVIDER_ID and container_name.
  # container_name MUST be "tnhcomfy-{PROVIDER_ID}" so the backend can detect it
  # (see infrastructure/providers/runtime.py:provider_container_name).
  provider-modal-zetsuke:
    build:
      context: ./provider_containers
      dockerfile: image_worker/Dockerfile
    container_name: tnhcomfy-modal-zetsuke
    depends_on:
      backend_v2:
        condition: service_healthy
    profiles:
      - providers
    env_file:
      - .env.modal-zetsuke
    environment:
      - PROVIDER_ID=modal-zetsuke
      - PORT=8000
      - BACKEND_URL=http://backend_v2:8002
      - COMFY_DISCOVERY_TOKEN=${COMFY_DISCOVERY_TOKEN:-}
      - PROVIDER_WORKER_TOKEN=${PROVIDER_WORKER_TOKEN:-}
    user: "1000:1000"
    logging: *bounded-logging
    # Mount /data so provider workers can access models, input, output
    volumes:
      - ./data:/data
    networks:
      - tnhcomfy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  provider-modal-hp196:
    build:
      context: ./provider_containers
      dockerfile: image_worker/Dockerfile
    container_name: tnhcomfy-modal-hp196
    depends_on:
      backend_v2:
        condition: service_healthy
    profiles:
      - providers
    env_file:
      - .env.modal-hp196
    environment:
      - PROVIDER_ID=modal-hp196
      - PORT=8000
      - BACKEND_URL=http://backend_v2:8002
      - COMFY_DISCOVERY_TOKEN=${COMFY_DISCOVERY_TOKEN:-}
      - PROVIDER_WORKER_TOKEN=${PROVIDER_WORKER_TOKEN:-}
    user: "1000:1000"
    logging: *bounded-logging
    # Mount /data so provider workers can access models, input, output
    volumes:
      - ./data:/data
    networks:
      - tnhcomfy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  provider-modal-stepmania:
    build:
      context: ./provider_containers
      dockerfile: image_worker/Dockerfile
    container_name: tnhcomfy-modal-stepmania
    depends_on:
      backend_v2:
        condition: service_healthy
    profiles:
      - providers
    env_file:
      - .env.modal-stepmania
    environment:
      - PROVIDER_ID=modal-stepmania
      - PORT=8000
      - BACKEND_URL=http://backend_v2:8002
      - COMFY_DISCOVERY_TOKEN=${COMFY_DISCOVERY_TOKEN:-}
      - PROVIDER_WORKER_TOKEN=${PROVIDER_WORKER_TOKEN:-}
    user: "1000:1000"
    logging: *bounded-logging
    # Mount /data so provider workers can access models, input, output
    volumes:
      - ./data:/data
    networks:
      - tnhcomfy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  provider-llm-local:
    build:
      context: ./provider_containers
      dockerfile: llm_worker/Dockerfile
    container_name: tnhcomfy-llm-local
    profiles:
      - providers
    env_file:
      - .env.llm-local
    depends_on:
      backend_v2:
        condition: service_healthy
    environment:
      - PROVIDER_ID=llm-local
      - PORT=8000
      - BACKEND_URL=http://backend_v2:8002
      - COMFY_DISCOVERY_TOKEN=${COMFY_DISCOVERY_TOKEN:-}
      - PROVIDER_WORKER_TOKEN=${PROVIDER_WORKER_TOKEN:-}
      - ENGINE=openai_compat
    user: "1000:1000"
    volumes:
      - ./data:/data
    networks:
      - tnhcomfy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  provider-direct-url:
    build:
      context: ./provider_containers
      dockerfile: image_worker/Dockerfile
    container_name: tnhcomfy-direct-url
    depends_on:
      backend_v2:
        condition: service_healthy
    profiles:
      - providers
    env_file:
      - .env.direct-url
    user: "1000:1000"
    volumes:
      - ./data:/data
    networks:
      - tnhcomfy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

