# docker-compose.dev.yml
# Development override — hot-reload, source mounts, debug-friendly
#
# Usage:
#   Core only (backend + frontend):
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build -V
#
#   With providers:
#     docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile providers up --build -V
#
#   `-V` is not optional in dev: the frontend's node_modules is an ANONYMOUS
#   volume seeded from the image (see the mount list below), so without
#   `--renew-anon-volumes` a package-lock.json bump leaves the container serving
#   the previous dependency set, silently and with no error.
#
#   Backend only (no Docker, faster iteration):
#     bash setup_jules.sh
#
# Access:
#   Via Traefik:  https://comfy.lan.thenaha.my.id  (Vite HMR over WSS)
#   Direct:       http://localhost:5174              (Vite HMR over WS)
#   Backend:      NO HOST PORT in either compose file. It is reachable from
#                 inside the `proxy` docker network (that is how Traefik reaches
#                 it) and from a shell with
#                 `docker compose exec backend_v2 curl -s localhost:8002/api/live`.
#                 `http://localhost:8002` on the host answers 000 — that is the
#                 security boundary, not a misconfiguration.
#
#   The FRONTEND is also not published on every interface, and for the same
#   reason rather than a different one: it proxies `/api` to that backend
#   (`vite.config.js` in dev, `nginx.conf` in prod), so publishing it publishes
#   the API. `COMFY_FRONTEND_BIND` in `.env` names the one address to serve it on;
#   unset means loopback. Set it to your VPN or LAN address to reach the site from
#   another machine — and understand that this widens the API's reach to every
#   peer that can route to that address.

services:
  # ─── Database ────────────────────────────────────────────
  db:
    ports:
      - "127.0.0.1:5432:5432"

  # ─── Backend ─────────────────────────────────────────────
  backend_v2:
    environment:
      - COMFY_UVICORN_RELOAD=1
      - PYTHONUNBUFFERED=1
    # No `ports:` — same as the base compose, and this override was silently
    # re-adding the one that got removed. That is worth noting on its own: a
    # dev override re-publishing a port is how a hardening change in the base
    # file gets undone without anybody editing the base file.
    #
    # For a shell: docker compose exec backend_v2 curl -s localhost:8002/api/live
    # Mount source code — uvicorn --reload watches /app for changes
    # pip packages live in system site-packages, not /app, so this is safe
    volumes:
      - ./backend_v2:/app
      - ./data:/data
      # Read-only mount of the project root for per-provider .env files
      # (same rationale as the base compose file).
      - ./:/comfyui:ro

  # ─── Frontend ────────────────────────────────────────────
  frontend_v2:
    build:
      target: dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5174"]
    ports:
      # The dev server binds 0.0.0.0 *inside the container* so Traefik can reach
      # it; that is separate from the host-side publishes below, which decide who
      # can reach the site — and, because this proxies `/api`, who can reach the
      # whole backend API.
      #
      # `127.0.0.1` keeps `http://localhost:5174` working, and the second binding
      # is `COMFY_FRONTEND_BIND` from `.env`. Unset, it defaults to `127.0.0.2`,
      # which is loopback and unroutable — so the default publishes nothing a
      # network can reach, and naming a VPN address is what adds one.
      - "127.0.0.1:5174:5174"
      - "${COMFY_FRONTEND_BIND:-127.0.0.2}:5174:5174"
    labels:
      - traefik.http.services.comfyui-frontend.loadbalancer.server.port=5174
    environment:
      - VITE_PROXY_TARGET=http://backend_v2:8002
      # Vite dev server host (for proper HMR host resolution behind Traefik)
      # Vite reads VITE_HMR_HOST, VITE_HMR_PORT, VITE_HMR_PROTOCOL for HMR config
    # Mount source for Vite HMR (usePolling: true in vite.config.js)
    volumes:
      - ./frontend_v2/src:/app/src
      - ./frontend_v2/public:/app/public
      - ./frontend_v2/index.html:/app/index.html
      - ./frontend_v2/vite.config.js:/app/vite.config.js
      # Build inputs that change independently of `src`. Without these the
      # container silently uses the image's copies, which reads as a Vite or
      # Tailwind bug rather than a mount gap:
      #   package.json / package-lock.json -> dependency edits and lockfile
      #     bumps are invisible until a rebuild;
      #   postcss.config.js -> a Tailwind change to index.html IS picked up but
      #     runs through the IMAGE's plugin config, so it half-applies;
      #   eslint.config.js -> `npm run lint` in the container lints the wrong
      #     rules;
      #   scripts/ -> holds the preinstall npm-only guard.
      - ./frontend_v2/package.json:/app/package.json
      - ./frontend_v2/package-lock.json:/app/package-lock.json
      - ./frontend_v2/postcss.config.js:/app/postcss.config.js
      - ./frontend_v2/eslint.config.js:/app/eslint.config.js
      - ./frontend_v2/scripts:/app/scripts
      # Preserve node_modules from the build (don't mount over it).
      #
      # ANONYMOUS, and that is load-bearing. Docker seeds a fresh *anonymous*
      # volume from the image's contents; a *named* volume starts empty. Naming
      # it (`frontend_node_modules:`) for visibility therefore made the container
      # start with no node_modules at all and the dev server died on
      # `exec: npm: not found` — so the visibility win cost the whole frontend.
      # A named volume would need an entrypoint that seeds or re-runs `npm ci`,
      # which is more moving parts than this is worth.
      #
      # The cost of staying anonymous: it is invisible to `docker volume ls`, so
      # a lockfile change needs the `-V` / `--renew-anon-volumes` flag on
      # `docker compose up` to take effect. AGENTS.md and README.md both
      # document `-V` for exactly this reason, and `docker volume ls -f
      # dangling=true` will find it. Mounting package.json does NOT fix the
      # stale-dependency case on its own: a changed lockfile still needs the
      # re-`npm ci` that `-V` triggers.
      - /app/node_modules
    # Healthcheck on port 5174
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5174/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── Provider (opt-in: --profile providers) ─────────────
  provider-modal-zetsuke:
    profiles:
      - providers
    # Generous limits for dev — remove to inherit base compose limits
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: "8"
  provider-modal-stepmania:
    profiles:
      - providers
    # Generous limits for dev — remove to inherit base compose limits
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: "8"
  # Was the one image provider missing from this list, so it kept the base's
  # 8G/4cpu while its two Modal siblings were raised. That is not a deliberate
  # asymmetry: hp196 is the account that also backs `tts-modal-hp196`, so the
  # provider with the *most* work on it had the *least* headroom. Raised to match
  # its siblings rather than commented out as intentional, because the block it
  # would have documented was simply forgotten.
  provider-modal-hp196:
    profiles:
      - providers
    # Generous limits for dev — remove to inherit base compose limits
    deploy:
      resources:
        limits:
          memory: 16G
          cpus: "8"
