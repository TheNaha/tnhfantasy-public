services:
  backend_v2:
    volumes:
      - ./backend_v2:/app
    environment:
      - COMFY_UVICORN_RELOAD=1

  frontend_v2:
    build:
      context: ./frontend_v2
      target: dev
    volumes:
      - ./frontend_v2:/app:z
    environment:
      - VITE_API_URL=http://localhost:8002
      - VITE_PROXY_TARGET=http://tnhcomfy-backend:8002
      - CHOKIDAR_USEPOLLING=true
    labels:
      - traefik.http.services.tnhcomfy.loadbalancer.server.port=5174
