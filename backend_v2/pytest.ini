[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_functions = test_*
# pytest 9 collects in `importlib` mode, which does NOT put the test directory on
# `sys.path`. Two helpers in `tests/` need to be importable by name:
# `repo_paths` (checkout-root resolution for the contract tests that read
# `docs/`, `frontend_v2/e2e/` and `remote_agent/`) and any future shared test
# utility. Without this they are unimportable, and a test module that fails to
# import aborts collection for the whole suite.
pythonpath = tests
addopts = -v --tb=short -n auto
# `-n auto` runs one worker per core. The suite is ~3,900 tests and ran
# serially; on an 8-core box that is ~10m40s serial against ~4m in
# parallel, and on a 2-core CI runner it is still a win.
#
# It needs `pytest-xdist`, which is in requirements.txt next to the other
# test dependencies. Without it pytest fails on the unknown option, so
# `-p no:xdist` is not a way out - install the requirements.
#
# The suite is now order-independent. Three things had to be fixed for that
# to be true, and they are worth knowing about:
#
#   * the RAM cache manager was a process-wide singleton whose directory was
#     fixed at first construction, so a test that pointed RAM_CACHE_DIR
#     somewhere else was ignored;
#   * `remote_agent/server.py` refuses to import without a token, so the
#     tests that import it only passed if an EARLIER test had happened to
#     set one;
#   * the Director's local tier loaded a real 200 MB sentence-transformer
#     model, which is now stubbed.
filterwarnings =
    ignore::DeprecationWarning
