name: Provider Tests

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'provider_containers/**'
      - '.github/workflows/provider-tests.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'provider_containers/**'
      - '.github/workflows/provider-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./provider_containers

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'
        cache-dependency-path: provider_containers/requirements-test.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-test.txt

    - name: Compile provider sources
      run: python -m compileall -q provider_core image_worker llm_worker

    - name: Run tests with pytest
      run: |
        pytest tests -v
