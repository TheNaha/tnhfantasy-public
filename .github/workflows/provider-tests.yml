name: Provider Tests

on:
  push:
    branches: [ "master" ]
    paths:
      # `remote_agent/` (incl. `remote_agent/provider_core/`) is the remaining
      # provider-surface that still ships an image and runs its own tests via
      # `compileall`. The four containerized workers and `provider_containers/`
      # were removed in favor of in-process engines
      # (`backend_v2/services/engines/`); nothing here builds them anymore.
      - 'remote_agent/**'
      # The `app-images` job below is the only thing in CI that renders
      # `docker-compose.yml` or builds the backend/frontend images, and these
      # globs are what it reads.
      - 'docker-compose*.yml'
      - 'scripts/**'
      - '.env.example*'
      - '.github/workflows/**'
      # The `app-images` job builds these two Dockerfiles.
      - 'backend_v2/Dockerfile'
      - 'frontend_v2/Dockerfile'
      - 'backend_v2/requirements.txt'
      - 'frontend_v2/bun.lock'
      # The root `.dockerignore` governs the remote agent's build context.
      - '.dockerignore'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'remote_agent/**'
      - 'docker-compose*.yml'
      - 'scripts/**'
      - '.env.example*'
      - '.github/workflows/**'
      - 'backend_v2/Dockerfile'
      - 'frontend_v2/Dockerfile'
      - 'backend_v2/requirements.txt'
      - 'frontend_v2/bun.lock'
      - '.dockerignore'

jobs:
  # ── the two application images ──────────────────────────────────────────────
  # `backend_v2/Dockerfile` and `frontend_v2/Dockerfile` are what actually runs.
  # This job is the only thing in CI that builds them: the host test suites run
  # in a venv / `bun install`, so a bad COPY, missing system package, broken lockfile
  # resolves nothing, or a frontend `bun install` that breaks on a lockfile bump all
  # ship green in `backend-tests.yml` / `frontend-tests.yml` unless we build the
  # image here. A green suite says nothing about whether the image builds.
  app-images:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Compile remote_agent sources
      # `provider_core` now lives under `remote_agent/` and is imported by the
      # frozen binary + the agent image. A syntax error there reaches main only
      # via the build-agent-binaries or app-images jobs; this compileall is the
      # cheaper net.
      run: |
        cd remote_agent
        python -m compileall -q provider_core server.py
        pip install ruff
        ruff check - --select F provider_core

    - name: Build the remote agent image
      run: docker build -f remote_agent/Dockerfile -t tnhfantasy-provider-test-agent:latest .

    - name: Build the backend image
      run: docker build -f backend_v2/Dockerfile -t tnhfantasy-backend-build-check:latest backend_v2

    - name: Build the frontend image (prod target)
      run: docker build --target prod -f frontend_v2/Dockerfile -t tnhfantasy-frontend-build-check:latest frontend_v2

    - name: Build the frontend image (dev target)
      run: docker build --target dev -f frontend_v2/Dockerfile -t tnhfantasy-frontend-dev-build-check:latest frontend_v2
