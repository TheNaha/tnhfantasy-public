name: E2E Tests

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'frontend_v2/**'
      - 'backend_v2/**'
      - '.github/workflows/frontend-e2e.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'frontend_v2/**'
      - 'backend_v2/**'
      - '.github/workflows/frontend-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The job set no timeout, and twelve consecutive red runs each burned about
    # 1h20m of runner time (run 37196314564: 50 failed, 3 flaky, 28 skipped, 86
    # passed, 1.3h). A red e2e job that costs more than an hour per push is a red
    # job people stop reading, which is how a 422 in a seed helper went unnoticed
    # through several passes. Bounded, and long enough for the two Playwright
    # passes plus retries.
    timeout-minutes: 45

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: comfy
          POSTGRES_PASSWORD: comfy
          POSTGRES_DB: comfy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      COMFY_DATABASE_URL: postgresql://comfy:comfy@localhost:5432/comfy
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        working-directory: ./frontend_v2

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'
        cache-dependency-path: backend_v2/requirements.txt

    - name: Install backend dependencies
      run: pip install -r ../backend_v2/requirements.txt

    - name: Start backend (migrations auto-run at boot)
      working-directory: ./backend_v2
      # The PID goes in a file, not only into the shell's job table: this step's
      # shell exits immediately, and `disown` only hides the job from a shell that
      # no longer exists, so nothing downstream could stop the process or read
      # its log. See the teardown step below.
      run: |
        nohup uvicorn api.main:app --host 0.0.0.0 --port 8002 \
          > /tmp/backend.log 2>&1 &
        echo $! > /tmp/backend.pid
        disown
      shell: bash

    - name: Wait for backend health
      run: |
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:8002/api/ready >/dev/null 2>&1; then
            echo "Backend is healthy"; exit 0
          fi
          echo "Waiting for backend... ($i)"; sleep 2
        done
        echo "--- backend.log ---"; cat /tmp/backend.log
        exit 1

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install frontend dependencies
      run: bun install --frozen-lockfile

    - name: Install Playwright browsers
      run: bun x playwright install --with-deps chromium

    - name: Run Playwright tests
      # `--grep-invert @fullstack` is load-bearing, and the backend above is what
      # the remaining tests need it for: `apiGet`/`apiPost` in e2e/fixtures.js go
      # through the dev server's proxy (5174 -> 8002), so the UI-level tests still
      # read and write the real database.
      #
      # The @fullstack tests cannot run here. Per e2e/README.md each one submits a
      # real job through a Modal/Beam provider and a real LLM through llm-local:
      # they need MODAL_TOKEN_ID/MODAL_TOKEN_SECRET, BEAM_API_KEY and a provider
      # account, they take minutes, and they are billed per run. This job has none
      # of that, so un-excluding them would turn a red job into a permanently red
      # one. `@fullstack` coverage is a manual/on-prem concern
      # (`bun run test:e2e:fullstack` against a real stack), and this job's
      # frontend_v2/** AND backend_v2/** trigger is correct because the UI-level
      # tests exercise both.
      run: bun x playwright test --project=chromium --grep-invert @fullstack
      env:
        VITE_PROXY_TARGET: http://localhost:8002

    # The mobile layout pass ran in NO workflow. `playwright.config.js` defines a
    # `mobile-chromium` project (Pixel 7) whose tests live in
    # `e2e/mobile-responsive.spec.js`, and the `chromium` project excludes that
    # file with `testIgnore: /mobile-responsive\.spec\.js/`. The step above pins
    # `--project=chromium`, so all nine mobile tests were unreachable from CI and
    # the only real measurement of tap targets, horizontal overflow and header
    # wrapping was manual.
    #
    # This matters more than usual right now: commit 295f8888 shipped a stray `}`
    # in `src/index.css` that closed the phone media query early and applied the
    # mobile touch geometry at every viewport width. Nothing in the unit suite
    # could see it (`mobileLayoutInvariants.test.js` regexed the file and never
    # checked block membership); a real 390px browser run can.
    - name: Mobile layout pass (390px)
      run: bun x playwright test --project=mobile-chromium --grep-invert @fullstack
      env:
        VITE_PROXY_TARGET: http://localhost:8002

    - name: Stop the backend and show its log
      # `if: always()` — the log is most useful when the tests above failed, which
      # is exactly when a plain step would be skipped. Before this, a failing run
      # showed only Playwright output, and the backend's own error was in
      # /tmp/backend.log where nothing read it.
      if: always()
      run: |
        echo "--- backend.log (tail) ---"
        tail -100 /tmp/backend.log || true
        if [ -f /tmp/backend.pid ]; then
          kill "$(cat /tmp/backend.pid)" 2>/dev/null || true
          rm -f /tmp/backend.pid
        fi

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend_v2/playwright-report/
        retention-days: 7
