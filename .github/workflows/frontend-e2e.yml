name: E2E Tests

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'frontend_v2/**'
      - 'backend_v2/**'
      - '.github/workflows/frontend-e2e.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'frontend_v2/**'
      - 'backend_v2/**'
      - '.github/workflows/frontend-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: comfy
          POSTGRES_PASSWORD: comfy
          POSTGRES_DB: comfy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      COMFY_DATABASE_URL: postgresql://comfy:comfy@localhost:5432/comfy
      PYTHONUNBUFFERED: "1"

    defaults:
      run:
        working-directory: ./frontend_v2

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'
        cache-dependency-path: backend_v2/requirements.txt

    - name: Install backend dependencies
      run: pip install -r ../backend_v2/requirements.txt

    - name: Start backend (migrations auto-run at boot)
      working-directory: ./backend_v2
      run: |
        nohup uvicorn api.main:app --host 0.0.0.0 --port 8002 \
          > /tmp/backend.log 2>&1 &
        disown
      shell: bash

    - name: Wait for backend health
      run: |
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:8002/api/health >/dev/null 2>&1; then
            echo "Backend is healthy"; exit 0
          fi
          echo "Waiting for backend... ($i)"; sleep 2
        done
        echo "--- backend.log ---"; cat /tmp/backend.log
        exit 1

    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend_v2/package-lock.json

    - name: Install frontend dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      run: npx playwright test --project=chromium
      env:
        VITE_PROXY_TARGET: http://localhost:8002

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend_v2/playwright-report/
        retention-days: 7
