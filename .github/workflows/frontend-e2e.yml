name: Frontend E2E Tests

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'frontend_v2/**'
      - '.github/workflows/frontend-e2e.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'frontend_v2/**'
      - '.github/workflows/frontend-e2e.yml'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend_v2

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend_v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend (SQLite)
        run: |
          cd ../backend_v2
          .venv/bin/uvicorn api.main:app --host 0.0.0.0 --port 8002 &
          echo $! > /tmp/backend.pid
        env:
          DATABASE_URL: sqlite:///./test.db
          COMFY_SETTINGS_PATH: ./config.json

      - name: Wait for backend
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:8002/health > /dev/null; do sleep 2; done'

      - name: Start frontend dev server
        run: npm run dev -- --host 0.0.0.0 --port 5174 &
        echo $! > /tmp/frontend.pid

      - name: Wait for frontend
        run: |
          timeout 60 bash -c 'until curl -s http://localhost:5174 > /dev/null; do sleep 2; done'

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        env:
          VITE_API_URL: http://localhost:8002

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend_v2/playwright-report/
          retention-days: 7
