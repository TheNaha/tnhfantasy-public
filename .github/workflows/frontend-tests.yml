name: Frontend Tests

on:
  push:
    branches: [ "master" ]
    paths:
      - 'frontend_v2/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'frontend_v2/**'
      - '.github/workflows/frontend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend_v2

    steps:
    - uses: actions/checkout@v4

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Lint
      run: bun run lint

    - name: Run tests
      run: bun run test

    - name: Build
      run: bun run build
