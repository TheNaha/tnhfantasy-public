name: build-agent-binaries

# Produces standalone tnhcomfy-agent executables for BOTH Linux and Windows,
# so users can run the remote agent on the ComfyUI host machine without Docker
# or a Python install. See remote_agent/README.md.

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    paths:
      - "remote_agent/**"
      - "remote_agent/provider_core/**"
      - ".github/workflows/build-agent-binaries.yml"
    branches: [main, master]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]

    steps:
      - uses: actions/checkout@v4
        with:
          # provider_core + remote_agent must be siblings of this path.
          fetch-depth: 1

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Make workspace writable (Linux)
        if: runner.os == 'Linux'
        run: sudo chown -R $(whoami) $(pwd)

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r remote_agent/build-requirements.txt
          # Runtime deps bundled INSIDE the frozen binary. Read from
          # remote_agent/requirements.txt rather than re-declared here: the pins
          # used to live in this workflow, so bumping the requirements file left
          # every frozen binary on the old versions with a green job — and the
          # only verification is a /health curl, which a version skew does not
          # fail.
          pip install -r remote_agent/requirements.txt

      - name: Build standalone executable
        working-directory: remote_agent
        run: |
          # SPECPATH must be absolute so the spec can resolve REPO/pathex
          # correctly on the build host.
          pyinstaller --noconfirm --distpath ./dist --workpath ./build "${{ github.workspace }}/remote_agent/tnhcomfy-agent.spec"

      - name: Verify binary (Linux)
        if: runner.os == 'Linux'
        working-directory: remote_agent
        run: |
          # REMOTE_AGENT_TOKEN is mandatory: remote_agent/server.py raises at
          # import time without it (or REMOTE_AGENT_ALLOW_INSECURE=1). Without
          # this the process exited before the sleep and the curl failed, so
          # every push touching remote_agent/** or provider_core/** left this
          # job red.
          REMOTE_AGENT_TOKEN=ci-verification-token \
            PORT=8001 \
            DATA_DIR=/tmp/agentverify \
            ./dist/tnhcomfy-agent & AGENT_PID=$!
          trap 'kill $AGENT_PID 2>/dev/null || true; rm -rf /tmp/agentverify' EXIT
          mkdir -p /tmp/agentverify
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8001/health; then exit 0; fi
            kill -0 $AGENT_PID 2>/dev/null || { echo "agent exited early"; exit 1; }
            sleep 1
          done
          echo "agent did not become healthy in 20s"; exit 1

      - name: Verify binary (Windows)
        if: runner.os == 'Windows'
        working-directory: remote_agent
        shell: pwsh
        run: |
          # Same mandatory token as the Linux leg; server.py raises at import
          # time without it, so the process died before the healthcheck.
          New-Item -ItemType Directory -Force -Path "$env:TEMP\agentverify" | Out-Null
          $env:REMOTE_AGENT_TOKEN = "ci-verification-token"
          $env:PORT = "8001"
          $env:DATA_DIR = "$env:TEMP\agentverify"
          $p = Start-Process -FilePath "dist\tnhcomfy-agent.exe" -PassThru -NoNewWindow
          for ($i = 0; $i -lt 20; $i++) {
            if ($p.HasExited) { Write-Error "agent exited early"; exit 1 }
            try {
              $c = Invoke-WebRequest -UseBasicParsing http://localhost:8001/health
              if ($c.StatusCode -eq 200) { exit 0 }
            } catch { }
            Start-Sleep -Seconds 1
          }
          Write-Error "agent did not become healthy in 20s"; exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: tnhcomfy-agent-${{ runner.os }}
          path: remote_agent/dist/*
          if-no-files-found: error
