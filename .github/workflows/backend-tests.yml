name: Backend Tests

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'backend_v2/**'
      # `docs/api.md` is GENERATED from `app.openapi()` by
      # `scripts/generate_api_docs.py`, and `tests/test_api_docs_contract.py`
      # drift-checks it in both directions. Neither ran on a change to the
      # document alone, so the one file whose entire job is to track the API was
      # the one file that could drift silently. The generator itself lives under
      # `scripts/**`, which triggers `provider-tests.yml` — a workflow whose
      # app-images job renders the compose file but does not run the backend
      # suite — so the check had no trigger at all.
      - 'docs/api.md'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'backend_v2/**'
      # `docs/api.md` is GENERATED from `app.openapi()` by
      # `scripts/generate_api_docs.py`, and `tests/test_api_docs_contract.py`
      # drift-checks it in both directions. Neither ran on a change to the
      # document alone, so the one file whose entire job is to track the API was
      # the one file that could drift silently. The generator itself lives under
      # `scripts/**`, which triggers `provider-tests.yml` — a workflow whose
      # app-images job renders the compose file but does not run the backend
      # suite — so the check had no trigger at all.
      - 'docs/api.md'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: comfy
          POSTGRES_PASSWORD: comfy
          POSTGRES_DB: comfy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGVECTOR_TEST_URL: postgresql://comfy:comfy@localhost:5432/comfy

    defaults:
      run:
        working-directory: ./backend_v2

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff

    - name: Lint with ruff
      run: ruff check .

    - name: Run tests with pytest
      run: |
        pytest tests
