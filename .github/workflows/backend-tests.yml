name: Backend Tests

on:
  push:
    branches: [ "master" ]
    paths:
      - 'backend_v2/**'
      # `docs/api.md` is GENERATED from `app.openapi()` by
      # `scripts/generate_api_docs.py`, and `tests/test_api_docs_contract.py`
      # drift-checks it in both directions. Neither ran on a change to the
      # document alone, so the one file whose entire job is to track the API was
      # the one file that could drift silently. The generator itself lives under
      # `scripts/**`, which triggers `provider-tests.yml` — a workflow whose
      # app-images job renders the compose file but does not run the backend
      # suite — so the check had no trigger at all.
      - 'docs/api.md'
      - '.github/workflows/backend-tests.yml'
      # The two provider contract tests live in backend_v2/tests but parse
      # THESE trees: test_deployable_contract.py (engines <-> deployables, both
      # directions) and test_provider_core_parity.py (provider_worker_core <->
      # provider_core fork). Neither deployables/** nor remote_agent/** had any
      # trigger that ran pytest, so breaking either contract shipped green.
      - 'deployables/**'
      - 'remote_agent/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'backend_v2/**'
      # `docs/api.md` is GENERATED from `app.openapi()` by
      # `scripts/generate_api_docs.py`, and `tests/test_api_docs_contract.py`
      # drift-checks it in both directions. Neither ran on a change to the
      # document alone, so the one file whose entire job is to track the API was
      # the one file that could drift silently. The generator itself lives under
      # `scripts/**`, which triggers `provider-tests.yml` — a workflow whose
      # app-images job renders the compose file but does not run the backend
      # suite — so the check had no trigger at all.
      - 'docs/api.md'
      - '.github/workflows/backend-tests.yml'
      # Same reason as push: the deployable/provider-core contract tests parse
      # deployables/** and remote_agent/**, so those trees must trigger them.
      - 'deployables/**'
      - 'remote_agent/**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: comfy
          POSTGRES_PASSWORD: comfy
          POSTGRES_DB: comfy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGVECTOR_TEST_URL: postgresql://comfy:comfy@localhost:5432/comfy

    defaults:
      run:
        working-directory: ./backend_v2

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff

    - name: Lint with ruff
      run: ruff check .

    - name: Lint deployables (own ruff.toml)
      working-directory: ./deployables
      # deployables/ carries its own ruff config; nothing else in CI read it.
      run: ruff check .

    - name: Run tests with pytest
      run: |
        # `-n auto` is in pytest.ini's addopts: one worker per core. The
        # suite is ~3,900 tests and ran serially, which dominated the job's
        # wall clock. It needs pytest-xdist, which is in requirements.txt.
        pytest tests
