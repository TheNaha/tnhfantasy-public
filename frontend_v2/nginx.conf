server {
    listen 5174;
    server_name _;
    client_max_body_size 50m;
    root /usr/share/nginx/html;
    index index.html;

    # Non-root runtime. The worker cannot write nginx's stock root-owned temp
    # paths, so they are redirected to /tmp (created and chowned in the
    # Dockerfile). `pid` is deliberately NOT here: it is a main-context
    # directive, and putting it in a `conf.d` server block makes nginx refuse
    # to start with `[emerg] "pid" directive is not allowed here`. It is passed
    # on the command line instead, which is the only place a non-root master can
    # redirect it.
    error_log /dev/stderr warn;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Runtime DNS re-resolution for the API upstreams.
    #
    # `proxy_pass http://backend_v2:8002` with a literal hostname is resolved
    # ONCE at startup and the IP is cached forever, so the `resolver` directive
    # is never consulted. Because compose sets `restart: unless-stopped`, a
    # backend crash hands it a new IP and the frontend then returns 502 for
    # /api/ and /socket.io/ until the frontend itself restarts, with no way to
    # recover short of restarting the frontend.
    #
    # Routing proxy_pass through a variable forces a per-request lookup, which
    # is why the `resolver` below is now load-bearing rather than decorative.
    # 127.0.0.11 is Docker's embedded DNS resolver.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream backend_v2:8002;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;
        proxy_next_upstream error http_502 http_503;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

    location /socket.io/ {
        set $ws_upstream backend_v2:8002;
        proxy_pass http://$ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
