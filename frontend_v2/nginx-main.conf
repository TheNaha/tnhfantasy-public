worker_processes auto;
error_log /dev/stderr warn;

# The master process runs as uid 1000 (see the `USER app` in the Dockerfile), so
# the stock root-owned /var/run/nginx.pid cannot be opened. /tmp is writable.
# This replaces the stock nginx.conf rather than overriding it on the command
# line, because `-g "pid ..."` is rejected as a duplicate when the main config
# already sets one.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    # All of these are redirected to /tmp for the same reason as `pid` above.
    # They are set here as well as in conf.d/default.conf: these are the
    # http-level defaults, and the server block narrows them for this vhost.
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    include /etc/nginx/conf.d/*.conf;
}
